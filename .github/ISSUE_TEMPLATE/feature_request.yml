name: 💡 Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: What problem does it solve for you?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or examples from other apps are welcome.
